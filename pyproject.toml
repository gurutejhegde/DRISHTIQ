[project]
name = "nazarbit"
version = "0.1.0"
description = "Viewer-Aware Streaming: Personalized Quality per Megabyte"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core Shared Models & Numerical Base
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # Member 1: Content Analysis (Frames, Scene Cuts, Complexity, Texture)
    "opencv-python-headless>=4.10.0",
    "scenedetect>=0.6.4",
    "scikit-image>=0.23.0",
    "scipy>=1.13.0",
    "pillow>=10.3.0",

    # Member 2: Content-Aware Encoding (Pipelines, Manifests, Metrics)
    "ffmpeg-python>=0.2.0",
    "m3u8>=5.0.0",

    # Member 3: Budget-Aware Streaming & Network Simulation
    "httpx>=0.27.0",

    # Member 4: Demo Platform & Visualization
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
ml = [
    "ultralytics>=8.2.0",
]

[project.scripts]
nazarbit-analyze = "nazarbit.analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
